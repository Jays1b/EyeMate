name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Cache python-for-android / buildozer
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install master buildozer (needed by Camera4Kivy)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install git+https://github.com/kivy/buildozer.git

      - name: Clone camerax_provider hook
        run: |
          git clone --depth 1 https://github.com/Android-for-Python/camerax_provider.git

      - name: Build debug APK
        run: |
          set -o pipefail
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          python -m buildozer -v android debug 2>&1 | tee buildozer.log
        env:
          BUILDKITE_ANALYTICS_TOKEN: ""

      - name: Upload Buildozer log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: EyeMate-build-log
          path: buildozer.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: EyeMate-debug-apk
          path: bin/*.apk
          if-no-files-found: error