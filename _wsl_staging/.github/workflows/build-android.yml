name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Cache python-for-android / buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install master buildozer (needed by Camera4Kivy)
        run: |
          pip3 install --upgrade pip setuptools
          pip3 install git+https://github.com/kivy/buildozer.git

      - name: Clone camerax_provider hook
        run: |
          git clone --depth 1 https://github.com/inclement/camerax_provider.git

      - name: Build debug APK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          buildozer -v android debug
        env:
          BUILDKITE_ANALYTICS_TOKEN: ""

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeMate-debug-apk
          path: bin/*.apk
          if-no-files-found: error